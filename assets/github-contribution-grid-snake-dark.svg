<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%" fill="none" role="img" aria-label="GitHub Contribution Activity Grid">
  <title>Contribution Activity</title>
  <desc>Visual grid representing developer contribution frequency, cadence, and commit history.</desc>

  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      @keyframes crawl {
        0% { transform: translate(0, 0); }
        25% { transform: translate(140px, 30px); }
        50% { transform: translate(320px, 15px); }
        75% { transform: translate(520px, 45px); }
        100% { transform: translate(720px, 0); }
      }
      .snake-head {
        animation: crawl 14s linear infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .snake-head { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="880" height="140" rx="10" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>

