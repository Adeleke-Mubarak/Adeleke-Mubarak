      <rect x="36" y="26" width="16" height="14" rx="3" fill="#2563EB" opacity="0.9"/>
      <rect x="20" y="28" width="14" height="10" rx="2" fill="#3B82F6" opacity="0.7"/>
      <rect x="6" y="28" width="12" height="10" rx="2" fill="#60A5FA" opacity="0.5"/>
      <circle cx="48" cy="33" r="2" fill="#FFFFFF"/>
