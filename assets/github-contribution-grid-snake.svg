<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%" fill="none" role="img" aria-label="GitHub Contribution Activity Grid (Light Theme)">
  <title>Contribution Activity</title>
  <desc>Visual grid representing developer contribution frequency, cadence, and commit history.</desc>

  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      @keyframes crawlLight {
        0% { transform: translate(0, 0); }
        25% { transform: translate(140px, 30px); }
        50% { transform: translate(320px, 15px); }
        75% { transform: translate(520px, 45px); }
        100% { transform: translate(720px, 0); }
      }
      .snake-head-light {
        animation: crawlLight 14s linear infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .snake-head-light { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="880" height="140" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Metadata Header -->
  <g transform="translate(24, 22)">
    <text x="0" y="0" fill="#475569" font-size="10.5" font-weight="600" letter-spacing="1.2" class="mono">
      CONTRIBUTION FREQUENCY <tspan fill="#2563EB">//</tspan> CADENCE ARCHIVE
    </text>
    <g transform="translate(680, -6)">
      <text x="0" y="8" fill="#64748B" font-size="9" class="mono">LESS</text>
      <rect x="32" y="0" width="10" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="46" y="0" width="10" height="10" rx="2" fill="#BFDBFE"/>
      <rect x="60" y="0" width="10" height="10" rx="2" fill="#60A5FA"/>
      <rect x="74" y="0" width="10" height="10" rx="2" fill="#2563EB"/>
      <rect x="88" y="0" width="10" height="10" rx="2" fill="#1D4ED8"/>
      <text x="106" y="8" fill="#64748B" font-size="9" class="mono">MORE</text>
    </g>
  </g>

  <!-- Contribution Grid Matrix -->
  <g transform="translate(24, 40)">
    <!-- Column 1-10 -->
    <rect x="0" y="0" width="12" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="0" y="14" width="12" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="0" y="28" width="12" height="10" rx="2" fill="#BFDBFE"/>
    <rect x="0" y="42" width="12" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="0" y="56" width="12" height="10" rx="2" fill="#2563EB"/>
    <rect x="0" y="70" width="12" height="10" rx="2" fill="#E2E8F0"/>

    <rect x="16" y="0" width="12" height="10" rx="2" fill="#BFDBFE"/>
    <rect x="16" y="14" width="12" height="10" rx="2" fill="#2563EB"/>
    <rect x="16" y="28" width="12" height="10" rx="2" fill="#60A5FA"/>
    <rect x="16" y="42" width="12" height="10" rx="2" fill="#BFDBFE"/>
    <rect x="16" y="56" width="12" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="16" y="70" width="12" height="10" rx="2" fill="#1D4ED8"/>

    <rect x="32" y="0" width="12" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="32" y="14" width="12" height="10" rx="2" fill="#1D4ED8"/>
    <rect x="32" y="28" width="12" height="10" rx="2" fill="#E2E8F0"/>
