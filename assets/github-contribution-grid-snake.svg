      <rect x="96" y="0" width="12" height="10" rx="2" fill="#1D4ED8"/>
      <rect x="96" y="14" width="12" height="10" rx="2"/>
      <rect x="96" y="28" width="12" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="96" y="42" width="12" height="10" rx="2" fill="#2563EB"/>
      <rect x="96" y="56" width="12" height="10" rx="2" fill="#BFDBFE"/>
      <rect x="96" y="70" width="12" height="10" rx="2" fill="#60A5FA"/>

      <rect x="112" y="0" width="12" height="10" rx="2"/>
      <rect x="112" y="14" width="12" height="10" rx="2" fill="#3B82F6"/>
