        <rect x="48" y="0" width="12" height="10" rx="2"/>
        <rect x="48" y="14" width="12" height="10" rx="2" fill="#2563EB"/>
        <rect x="48" y="28" width="12" height="10" rx="2"/>
        <rect x="48" y="42" width="12" height="10" rx="2" fill="#BFDBFE"/>
        <rect x="48" y="56" width="12" height="10" rx="2" fill="#3B82F6"/>
        <rect x="48" y="70" width="12" height="10" rx="2"/>

        <rect x="64" y="0" width="12" height="10" rx="2" fill="#1D4ED8"/>
        <rect x="64" y="14" width="12" height="10" rx="2"/>
        <rect x="64" y="28" width="12" height="10" rx="2" fill="#2563EB"/>
        <rect x="64" y="42" width="12" height="10" rx="2"/>
        <rect x="64" y="56" width="12" height="10" rx="2" fill="#BFDBFE"/>
        <rect x="64" y="70" width="12" height="10" rx="2"/>

        <rect x="80" y="0" width="12" height="10" rx="2"/>
